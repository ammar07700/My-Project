<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Neon Particle Heart & Matrix</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background-color: #030008;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #matrix-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.6;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>
    <canvas id="matrix-canvas"></canvas>
    <div id="canvas-container"></div>

    <script>
        const matrixCanvas = document.getElementById("matrix-canvas");
        const mCtx = matrixCanvas.getContext("2d");

        let mWidth = matrixCanvas.width = window.innerWidth;
        let mHeight = matrixCanvas.height = window.innerHeight;

        const chars = "0123456789♥♡LOVE";
        const fontSize = 16;

        let columns = Math.floor(mWidth / fontSize);
        let drops = Array(columns)
            .fill(0)
            .map(() => Math.random() * -50);

        function drawMatrix() {
            mCtx.fillStyle = "rgba(3, 0, 8, 0.15)";
            mCtx.fillRect(0, 0, mWidth, mHeight);

            mCtx.fillStyle = "#ff1493";
            mCtx.font = `${fontSize}px monospace`;

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                const x = i * fontSize;
                const y = drops[i] * fontSize;

                mCtx.fillText(text, x, y);

                if (y > mHeight && Math.random() > 0.975) {
                    drops[i] = 0;
                }

                drops[i]++;
            }
        }

        const container = document.getElementById("canvas-container");
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        camera.position.z = 100;

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true
        });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const particleCount = 4000;
        const geometry = new THREE.BufferGeometry();

        const positions = new Float32Array(particleCount * 3);
        const targetPositions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 300;
            positions[i + 1] = (Math.random() - 0.5) * 300;
            positions[i + 2] = (Math.random() - 0.5) * 300;

            targetPositions[i] = 0;
            targetPositions[i + 1] = 0;
            targetPositions[i + 2] = 0;
        }

        geometry.setAttribute(
            "position",
            new THREE.BufferAttribute(positions, 3)
        );

        function createGlowTexture() {
            const canvas = document.createElement("canvas");
            canvas.width = 64;
            canvas.height = 64;

            const ctx = canvas.getContext("2d");

            const gradient = ctx.createRadialGradient(
                32,
                32,
                0,
                32,
                32,
                32
            );

            gradient.addColorStop(0, "rgba(255, 255, 255, 1)");
            gradient.addColorStop(0.3, "rgba(255, 105, 180, 0.8)");
            gradient.addColorStop(1, "rgba(255, 20, 147, 0)");

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);

            return new THREE.CanvasTexture(canvas);
        }

        const material = new THREE.PointsMaterial({
            size: 2.5,
            map: createGlowTexture(),
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particleSystem = new THREE.Points(
            geometry,
            material
        );

        scene.add(particleSystem);

        // Added optional "yOffset" parameter so text can be pushed down
        // (used for the heart's "I Love You / Sofie" text) without
        // affecting the countdown/word steps.
        function getOffscreenPoints(text, fontScale = 1, yOffset = 0) {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");

            canvas.width = 400;
            canvas.height = 400;

            ctx.font = `bold ${Math.floor(80 * fontScale)}px sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "#ffffff";

            const lines = text.split("\n");
            const lineHeight = 70;
            const totalHeight = (lines.length - 1) * lineHeight;

            lines.forEach((line, index) => {
                const y = 200 - totalHeight / 2 + index * lineHeight + yOffset;
                ctx.fillText(line, 200, y);
            });

            const imageData = ctx.getImageData(
                0,
                0,
                canvas.width,
                canvas.height
            );

            const points = [];

            for (let y = 0; y < 400; y += 3) {
                for (let x = 0; x < 400; x += 3) {
                    const index = (y * 400 + x) * 4;

                    if (imageData.data[index + 3] > 128) {
                        points.push({
                            x: (x - 200) * 0.35,
                            y: -(y - 200) * 0.35,
                            z: (Math.random() - 0.5) * 5
                        });
                    }
                }
            }

            return points;
        }

        function getHeartPoints() {
            const points = [];
            const heartScale = 3.0;

            for (let i = 0; i < particleCount; i++) {
                const t = Math.random() * Math.PI * 2;

                const x = 16 * Math.pow(Math.sin(t), 3);

                const y =
                    13 * Math.cos(t) -
                    5 * Math.cos(2 * t) -
                    2 * Math.cos(3 * t) -
                    Math.cos(4 * t);

                const z = (Math.random() - 0.5) * 10;

                points.push({
                    x: x * heartScale,
                    y: y * heartScale,
                    z: z
                });
            }

            // yOffset of 55 pushes "I Love You" down, closer to "Sofie",
            // and away from the heart's top notch. Increase this value
            // to move the text further down; decrease to move it up.
            const textPoints = getOffscreenPoints(
                "I Love You\nSofie",
                0.40,
                55
            );

            for (
                let i = 0;
                i < textPoints.length && i < points.length;
                i++
            ) {
                points[i] = {
                    x: textPoints[i].x,
                    y: textPoints[i].y,
                    z: 8 + (Math.random() - 0.5) * 1.5
                };
            }

            return points;
        }

        function setTargetShape(points) {
            for (let i = 0; i < particleCount; i++) {
                const point = points[i % points.length];

                targetPositions[i * 3] = point.x;
                targetPositions[i * 3 + 1] = point.y;
                targetPositions[i * 3 + 2] = point.z;
            }
        }

        const steps = [
            {
                text: "3",
                scale: 1.5,
                duration: 1200
            },
            {
                text: "2",
                scale: 1.5,
                duration: 1200
            },
            {
                text: "1",
                scale: 1.5,
                duration: 1200
            },
            {
                text: "You",
                scale: 1.1,
                duration: 1400
            },
            {
                text: "Are",
                scale: 1.1,
                duration: 1400
            },
            {
                text: "My",
                scale: 1.1,
                duration: 1400
            },
            {
                text: "Love",
                scale: 1.1,
                duration: 1600
            },
            {
                heart: true,
                duration: 0
            }
        ];

        let stepIndex = 0;
        let isHeartMode = false;

        function nextStep() {
            if (stepIndex >= steps.length) {
                return;
            }

            const step = steps[stepIndex];

            if (step.heart) {
                isHeartMode = true;
                setTargetShape(getHeartPoints());
            } else {
                isHeartMode = false;
                setTargetShape(
                    getOffscreenPoints(step.text, step.scale)
                );
            }

            if (step.duration > 0) {
                setTimeout(() => {
                    stepIndex++;
                    nextStep();
                }, step.duration);
            }
        }

        setTimeout(nextStep, 500);

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            drawMatrix();

            const positionAttribute =
                geometry.attributes.position;

            const positionArray = positionAttribute.array;
            const speed = 0.08;

            for (
                let i = 0;
                i < particleCount * 3;
                i++
            ) {
                positionArray[i] +=
                    (targetPositions[i] - positionArray[i]) *
                    speed;
            }

            const time = clock.getElapsedTime();

            if (isHeartMode) {
                const pulse = 1 + Math.sin(time * 4) * 0.06;

                particleSystem.scale.set(
                    pulse,
                    pulse,
                    pulse
                );

                particleSystem.rotation.y =
                    Math.sin(time * 0.8) * 0.15;
            } else {
                particleSystem.scale.set(1, 1, 1);

                particleSystem.rotation.y =
                    Math.sin(time) * 0.05;
            }

            positionAttribute.needsUpdate = true;
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener("resize", () => {
            mWidth = matrixCanvas.width = window.innerWidth;
            mHeight = matrixCanvas.height = window.innerHeight;

            columns = Math.floor(mWidth / fontSize);

            drops = Array(columns)
                .fill(0)
                .map(() => Math.random() * -50);

            camera.aspect =
                window.innerWidth / window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

            renderer.setPixelRatio(
                Math.min(window.devicePixelRatio, 2)
            );
        });
    </script>
</body>
</html>
